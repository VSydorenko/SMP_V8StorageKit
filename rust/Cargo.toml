[package]
name = "kit"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "kit"
path = "src/main.rs"

# Залежності — мінімум, кожна з обґрунтуванням (спека #51 D0, план §3): serde_json — JSON-масив
# KIT_ARGV для диспетчера, далі профіль, файл сесій і JSON хука.
[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
