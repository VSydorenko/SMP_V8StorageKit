#@ target: overlay
#@ check: agentBase
#@ starts: Kit не може однозначно розібрати й звірити два підключення до бази: нерозбірне — дев-база 'dev' у v8storagekit.local.yaml. Рядок підключення містить ключ 'Usr' (логін чи пароль): логін і пароль не задаються в рядку підключення, у ньому лишаються лише Srvr=/Ref
infobases:
  dev: { connection: 'Srvr=a;Ref=b;Usr=u' }
