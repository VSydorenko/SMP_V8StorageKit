#@ target: manifest
#@ check: manifest
#@ starts: Маніфест {path}, воркспейс 'Alpha_SMB', джерело 'base', storage — містить невідомий ключ (ім'я не друкується). Дозволені: path, user. Перевірте пробіл після ':' і форму 'ключ: значення'.
version: 1
product: Fake
workspaces:
  - path: Alpha_SMB
    sources:
      base: { truth: storage, storage: { path: 'R:\x', password: 'p' } }
